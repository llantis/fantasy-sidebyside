  <rect x="196" y="660" width="230" height="64" rx="20" fill="#7cc4ff" opacity=".3"/>
  <!-- right (opponent) bars -->
  <rect x="598" y="300" width="230" height="64" rx="20" fill="#ffb86b"/>
  <rect x="598" y="420" width="230" height="64" rx="20" fill="#ffb86b" opacity=".75"/>
  <rect x="598" y="540" width="230" height="64" rx="20" fill="#ffb86b" opacity=".5"/>
  <rect x="598" y="660" width="230" height="64" rx="20" fill="#ffb86b" opacity=".3"/>
  <!-- live dot in the middle -->
  <circle cx="512" cy="512" r="46" fill="#3ddc84"/>
